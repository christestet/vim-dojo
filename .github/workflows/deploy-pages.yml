name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare site
        run: |
          mkdir _site
          cp index.html styles.css app.js sw.js manifest.webmanifest .nojekyll _site/
          cp -R assets _site/

      - name: Minify production assets
        run: |
          npx --yes esbuild@0.25.9 app.js --minify --charset=utf8 --target=es2020 --outfile=_site/app.js
          npx --yes esbuild@0.25.9 styles.css --minify --charset=utf8 --outfile=_site/styles.css
          npx --yes esbuild@0.25.9 sw.js --minify --charset=utf8 --target=es2020 --outfile=_site/sw.js

      - name: Enforce asset budgets
        run: |
          app_bytes=$(wc -c < _site/app.js)
          style_bytes=$(wc -c < _site/styles.css)
          font_count=$(find _site/assets/fonts -name '*.woff2' | wc -l)
          test "$app_bytes" -le 55000
          test "$style_bytes" -le 46000
          test "$font_count" -le 2

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
